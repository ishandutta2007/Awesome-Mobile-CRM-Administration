<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .stat-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -25px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 20px) scale(1.1); }
    }
    @keyframes pulseRing {
      0% { r: 18px; opacity: 0.6; }
      50% { r: 28px; opacity: 0.1; }
      100% { r: 18px; opacity: 0.6; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 12; animation: dashStream 4s linear infinite; }
    .ring-pulse { animation: pulseRing 3s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Glow Spheres (in background) -->
  <g class="orb-1" opacity="0.45">
    <circle cx="200" cy="80" r="130" fill="#38bdf8" filter="url(#softGlow)" opacity="0.3" />
  </g>
  <g class="orb-2" opacity="0.4">
    <circle cx="1020" cy="270" r="140" fill="#a855f7" filter="url(#softGlow)" opacity="0.25" />
    <circle cx="650" cy="310" r="100" fill="#6366f1" filter="url(#softGlow)" opacity="0.2" />
  </g>

  <!-- Subtle High-Tech Grid Matrix -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Dynamic Network Connection Streams -->
  <g opacity="0.35" stroke="url(#primaryGlow)" stroke-width="2" fill="none">
    <path d="M 80,180 Q 280,40 500,160 T 950,110 T 1150,220" class="stream-line" />
    <path d="M 50,300 Q 350,200 650,290 T 1120,80" class="stream-line" style="animation-duration: 6s;" />
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.4" />

  <!-- Main Hero Content (Foreground Layer) -->
  <g transform="translate(60, 48)">

    <!-- Top Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="16" cy="15" r="10" fill="none" stroke="#38bdf8" stroke-width="1" class="ring-pulse" />
      <text x="32" y="20" class="badge-text">📱 CURATED DIRECTORY &amp; ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" class="title-text">
        Awesome Mobile CRM Administration
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 108)">
      <text x="0" y="0" class="subtitle-text">
        Curated SaaS Platforms, Self-Hosted Stacks &amp; On-The-Go Field Admin Consoles
      </text>
      <text x="0" y="24" class="subtitle-text" style="font-size: 14px; fill: #64748b;">
        Engineered for System Administrators, Operations Leaders &amp; Platform Teams
      </text>
    </g>

    <!-- Dynamic Metric Feature Cards -->
    <g transform="translate(0, 158)">
      <!-- Card 1: Enterprise SaaS -->
      <g transform="translate(0, 0)">
        <rect width="210" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="28" class="stat-text">🏢 Enterprise SaaS</text>
        <text x="16" y="48" class="stat-label">Salesforce • M365 • AWS • Okta</text>
      </g>

      <!-- Card 2: Open-Source -->
      <g transform="translate(225, 0)">
        <rect width="210" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="28" class="stat-text">⚡ Open-Source Stacks</text>
        <text x="16" y="48" class="stat-label">Twenty • ERPNext • Chatwoot</text>
      </g>

      <!-- Card 3: Mobile Frameworks -->
      <g transform="translate(450, 0)">
        <rect width="210" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="28" class="stat-text">📲 Cross-Platform Native</text>
        <text x="16" y="48" class="stat-label">Flutter • React Native • Expo</text>
      </g>

      <!-- Card 4: Security & RBAC -->
      <g transform="translate(675, 0)">
        <rect width="210" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="28" class="stat-text">🔒 RBAC &amp; Sovereign</text>
        <text x="16" y="48" class="stat-label">Zero-Trust • RLS • Self-Hosted</text>
      </g>
    </g>

  </g>

  <!-- Decorative Corner Icon (Mobile Phone Admin Frame) -->
  <g transform="translate(1030, 45)" opacity="0.85">
    <rect x="0" y="0" width="105" height="195" rx="18" fill="#1e293b" stroke="url(#primaryGlow)" stroke-width="2" />
    <!-- Notch / speaker -->
    <rect x="36" y="7" width="33" height="4" rx="2" fill="#475569" />
    <!-- Screen content preview -->
    <rect x="8" y="20" width="89" height="165" rx="10" fill="#0f172a" />
    <!-- App Header -->
    <rect x="14" y="28" width="50" height="7" rx="3" fill="#38bdf8" />
    <circle cx="88" cy="31.5" r="3.5" fill="#a855f7" />
    <!-- Cards inside phone -->
    <rect x="14" y="42" width="77" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.7" />
    <rect x="20" y="48" width="45" height="4" rx="2" fill="#38bdf8" />
    <rect x="20" y="56" width="30" height="4" rx="2" fill="#64748b" />

    <rect x="14" y="76" width="77" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.7" />
    <rect x="20" y="82" width="50" height="4" rx="2" fill="#818cf8" />
    <rect x="20" y="90" width="38" height="4" rx="2" fill="#64748b" />

    <rect x="14" y="110" width="77" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.7" />
    <rect x="20" y="116" width="40" height="4" rx="2" fill="#34d399" />
    <rect x="20" y="124" width="25" height="4" rx="2" fill="#64748b" />

    <!-- Action Button inside phone -->
    <rect x="14" y="148" width="77" height="18" rx="6" fill="url(#primaryGlow)" />
    <rect x="35" y="155" width="35" height="4" rx="2" fill="#ffffff" />
  </g>

</svg>
